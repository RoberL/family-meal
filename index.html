<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Family Meal</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght=400;500;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f7f6f2;
    --card: #ffffff;
    --border: #e5e3dc;
    --text: #1a1a18;
    --muted: #6b6a65;
    --hint: #b0aea8;
    
    --shadow: 0 1px 3px rgba(0,0,0,0.07), 0 4px 12px rgba(0,0,0,0.04);
    
    /* 動態變數 */
    --current-theme-bg: #ffffff;
    --current-theme-border: #e5e3dc;
    --current-member-color: #111111;
  }

  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 0;
  }

  /* ── Header ── */
  header {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 16px 20px;
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .logo { font-size: 18px; font-weight: 700; letter-spacing: -0.02em; }
  
  .week-nav { display: flex; align-items: center; gap: 8px; position: relative; }
  .week-nav button { background: none; border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; font-size: 14px; cursor: pointer; color: var(--muted); font-family: inherit; transition: background 0.15s; z-index: 2; }
  .week-nav button:hover { background: var(--bg); }
  
  .label-picker-wrapper { position: relative; display: inline-flex; align-items: center; justify-content: center; min-width: 100px; }
  .week-label { font-size: 14px; font-weight: 500; text-align: center; text-decoration: underline; text-underline-offset: 4px; color: var(--muted); pointer-events: none; }
  
  .invisible-picker {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    opacity: 0;
    cursor: pointer;
    z-index: 1;
    -webkit-appearance: none;
  }

  .view-tabs { display: flex; gap: 4px; }
  .view-tab { padding: 6px 14px; border-radius: 6px; border: 1px solid var(--border); background: none; font-size: 13px; font-family: inherit; cursor: pointer; color: var(--muted); transition: all 0.15s; }
  .view-tab.active { background: var(--text); color: #fff; border-color: var(--text); }

  /* ── Layout ── */
  main { padding: 20px; max-width: 700px; margin: 0 auto; }

  /* ── Member Selector ── */
  .member-section { margin-bottom: 16px; }
  .section-label { font-size: 12px; color: var(--muted); font-weight: 500; letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 10px; }
  .member-pills { display: flex; gap: 8px; flex-wrap: wrap; }
  .member-pill {
    display: flex; align-items: center; gap: 7px;
    padding: 7px 14px; border-radius: 20px;
    border: 1.5px solid var(--border);
    background: var(--card);
    font-size: 14px; font-family: inherit; cursor: pointer;
    transition: all 0.15s; font-weight: 400; color: var(--text);
  }
  .member-pill .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .member-pill.active { border-width: 2px; font-weight: 500; }
  .member-pill:hover { transform: translateY(-1px); box-shadow: var(--shadow); }

  .edit-hint-banner {
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 10px;
    padding: 6px 12px;
    border-radius: 6px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all 0.25s ease;
  }

  /* ── Fill Table ── */
  .fill-card {
    background: var(--current-theme-bg);
    border-radius: 12px;
    border: 1px solid var(--current-theme-border);
    overflow: hidden;
    box-shadow: var(--shadow);
    transition: background 0.25s ease, border-color 0.25s ease;
  }
  .fill-table { width: 100%; border-collapse: collapse; }
  .fill-table thead th {
    padding: 10px 12px; font-size: 12px; font-weight: 500;
    color: var(--muted); text-align: center;
    border-bottom: 1px solid var(--current-theme-border);
    background: rgba(0, 0, 0, 0.02);
    letter-spacing: 0.03em;
    transition: border-color 0.25s ease;
  }
  .fill-table thead th:first-child { text-align: left; }
  .fill-table tbody tr:not(:last-child) { border-bottom: 1px solid var(--current-theme-border); transition: border-color 0.25s ease; }
  .fill-table tbody tr:hover { background: rgba(0, 0, 0, 0.01); }
  .fill-table td { padding: 10px 12px; vertical-align: middle; text-align: center; }
  .fill-table td:first-child { text-align: left; }
  .day-name { font-weight: 500; font-size: 14px; }
  .day-date { font-size: 11px; color: var(--hint); margin-top: 1px; }

  .toggle-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 42px; height: 32px; border-radius: 8px;
    border: 1.5px solid var(--border);
    background: var(--card);
    font-size: 13px; cursor: pointer; font-family: inherit;
    transition: all 0.15s; color: var(--hint);
    font-weight: 400;
  }
  .toggle-btn.on {
    background: #ffffff;
    border-color: var(--current-member-color);
    color: var(--current-member-color);
    font-weight: 700;
    box-shadow: 0 1px 4px rgba(0,0,0,0.05);
  }
  .toggle-btn:hover { transform: scale(1.05); }

  .note-input {
    border: 1px solid var(--border); border-radius: 6px;
    padding: 5px 8px; font-size: 12px; font-family: inherit;
    background: var(--card); color: var(--text); width: 100%; max-width: 130px;
  }
  .note-input:focus { outline: none; border-color: #aaa; }

  /* ── ✨ Summary View 2: Timeline Style ── */
  .timeline-container {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .day-card {
    background: var(--card);
    border-radius: 12px;
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .day-card-header {
    background: #faf9f6;
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 700;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .day-card-header span {
    font-size: 12px;
    font-weight: 400;
    color: var(--hint);
  }
  
  .meal-row {
    display: flex;
    align-items: center;
    padding: 12px 16px;
    gap: 12px;
    border-bottom: 1px solid #f1f0ea;
  }
  .meal-row:last-child { border-bottom: none; }
  
  /* 當該餐無人用餐時，整行優雅淡出留白 */
  .meal-row.empty {
    opacity: 0.45;
    background: #fafafa;
  }

  .meal-time {
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    width: 65px;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  /* 階梯式人數標籤樣式 */
  .count-pill {
    display: inline-block; 
    padding: 3px 10px; 
    border-radius: 12px;
    font-size: 12px; 
    font-weight: 700;
    min-width: 42px;
    text-align: center;
  }
  .count-pill.p0 { background: #eef0f2; color: #8a8d90; font-weight: 400; }
  .count-pill.p1 { background: #e6f7ed; color: #1a7a45; }
  .count-pill.p2 { background: #fff3e6; color: #d97706; }
  .count-pill.p3plus { background: #fdecea; color: #c0392b; }

  .meal-members {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    flex-grow: 1;
  }
  .meal-row.empty .meal-members {
    font-weight: 400;
    color: var(--hint);
    font-style: italic;
  }
  
  /* 成員名字小彩點提示 */
  .member-tag {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    margin-right: 8px;
  }
  .member-tag-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    display: inline-block;
  }

  .meal-note {
    font-size: 12px;
    color: #7f5539;
    background: #fff8f0;
    border: 1px dashed #eddcd2;
    padding: 3px 8px;
    border-radius: 6px;
    max-width: 220px;
    word-break: break-all;
  }

  /* ── Status bar ── */
  .status-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    padding: 8px 20px;
    background: var(--card);
    border-top: 1px solid var(--border);
    font-size: 12px; color: var(--muted);
    display: flex; align-items: center; gap: 8px;
    z-index: 99;
  }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--hint); flex-shrink: 0; }
  .status-dot.synced { background: #1a7a45; }
  .status-dot.syncing { background: #f0a500; animation: pulse 1s infinite; }

  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  /* ── Responsive ── */
  @media (max-width: 600px) {
    header { flex-wrap: wrap; padding: 12px; }
    .logo { font-size: 16px; }
    main { padding: 10px; margin-bottom: 40px; }
    .fill-table thead th, .fill-table td { padding: 8px 4px; font-size: 13px; }
    .toggle-btn { width: 36px; height: 30px; }
    .note-input { max-width: 75px; font-size: 11px; padding: 4px; }
    .member-pill { padding: 5px 10px; font-size: 13px; }
    .edit-hint-banner { font-size: 13px; }
    
    /* 手機版適度縮小與微調 */
    .meal-row { flex-wrap: wrap; gap: 8px; padding: 10px 12px; }
    .meal-members { width: 100%; order: 3; padding-left: 0; }
    .meal-note { width: 100%; order: 4; max-width: 100%; margin-top: 2px; }
  }

  .hidden { display: none !important; }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="logo">🍱The Kuo-sine Reservation Desk</div>
    <div class="week-nav">
      <button onclick="changeWeek(-1)">‹</button>
      <div class="label-picker-wrapper">
        <span class="week-label" id="weekLabel"></span>
        <input type="date" id="datePicker" class="invisible-picker" onchange="jumpToDate(this.value)">
      </div>
      <button onclick="changeWeek(1)">›</button>
    </div>
  </div>
  <div class="view-tabs">
    <button class="view-tab active" id="tabFill" onclick="setView('fill')">Fill in</button>
    <button class="view-tab" id="tabSummary" onclick="setView('summary')">Summary</button>
  </div>
</header>

<main>
  <!-- Fill in View -->
  <div id="fillView">
    <div class="member-section">
      <div class="section-label">Who r u?</div>
      <div class="member-pills" id="memberPills"></div>
    </div>
    
    <div class="edit-hint-banner" id="editHintBanner"></div>

    <div class="fill-card" id="fillCard">
      <table class="fill-table">
        <thead>
          <tr>
            <th>Date</th>
            <th>Lunch</th>
            <th>Dinner</th>
            <th style="text-align:left">Note</th>
          </tr>
        </thead>
        <tbody id="fillBody"></tbody>
      </table>
    </div>
  </div>

  <!-- ✨ Summary View (Timeline style) -->
  <div id="summaryView" class="hidden">
    <div class="timeline-container" id="timelineContainer"></div>
  </div>
</main>

<div class="status-bar">
  <div class="status-dot" id="statusDot"></div>
  <span id="statusText">Connecting…</span>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getDatabase, ref, onValue, set } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';

const firebaseConfig = {
  apiKey: "AIzaSyCeszklpOunCReunK5jjTsztAU7iEgWCoQ",
  authDomain: "family-meal-89d1e.firebaseapp.com",
  databaseURL: "https://family-meal-89d1e-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "family-meal-89d1e",
  storageBucket: "family-meal-89d1e.firebasestorage.app",
  messagingSenderId: "721568861768",
  appId: "1:721568861768:web:f39551b117c4318a6ed27d"
};

const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);

const MEMBERS = [
  { key: 'A', name: 'Sam',   color: '#111111', bg: '#f1f1f1', themeBg: '#fafafa', themeBorder: '#e0e0e0' }, 
  { key: 'B', name: 'Joyce',   color: '#0080FF', bg: '#e2ebf5', themeBg: '#f4f7fa', themeBorder: '#cfdae6' }, 
  { key: 'C', name: 'Anisa',   color: '#00DB00', bg: '#e2ece6', themeBg: '#f3f7f5', themeBorder: '#ccdcd2' }, 
  { key: 'D', name: 'Tom',    color: '#d53f8c', bg: '#fbe7f0', themeBg: '#fdf6fa', themeBorder: '#f3d5e4' }, 
];
const DAYS = ['Mon.','Tue.','Wed.','Thu.','Fri.','Sat.','Sun.'];

let weekOffset = 0;
let activeMember = 'A';
let localData = {};
let view = 'fill';

function getMonday(offset) {
  const d = new Date();
  const day = d.getDay() || 7;
  d.setDate(d.getDate() - day + 1 + offset * 7);
  d.setHours(0,0,0,0);
  return d;
}
function weekKey(offset) { return getMonday(offset).toISOString().slice(0,10); }
function weekDates(offset) {
  const mon = getMonday(offset);
  return DAYS.map((_,i) => { const d = new Date(mon); d.setDate(mon.getDate()+i); return d; });
}
function fmtLabel(offset) {
  const ds = weekDates(offset);
  const f  = d => `${d.getMonth()+1}/${d.getDate()}`;
  return `${f(ds[0])} – ${f(ds[6])}`;
}
function dbPath(offset) { return `meals/${weekKey(offset)}`; }

let unsubscribe = null;
function subscribe() {
  if (unsubscribe) unsubscribe();
  setStatus('syncing', 'Syncing…');
  const r = ref(db, dbPath(weekOffset));
  unsubscribe = onValue(r, snap => {
    localData = snap.val() || {};
    setStatus('synced', 'Synced');
    render();
  }, () => setStatus('error', 'Offline'));
}

function writeVal(path, value) {
  setStatus('syncing', 'Saving…');
  set(ref(db, path), value)
    .then(()  => setStatus('synced', 'Saved'))
    .catch(()  => setStatus('error', 'Save failed'));
}

function setStatus(state, msg) {
  const dot  = document.getElementById('statusDot');
  const text = document.getElementById('statusText');
  dot.className  = 'status-dot' + (state === 'synced' ? ' synced' : state === 'syncing' ? ' syncing' : '');
  text.textContent = msg;
}

function getVal(member, di, meal) { return !!(localData[member]?.[di]?.[meal]); }
function getNote(member, di) { return localData[member]?.[di]?.note || ''; }

function toggleVal(member, di, meal) {
  const newVal = !getVal(member, di, meal);
  if (!localData[member])       localData[member] = {};
  if (!localData[member][di])   localData[member][di] = {};
  localData[member][di][meal] = newVal;
  writeVal(`${dbPath(weekOffset)}/${member}/${di}/${meal}`, newVal);
  renderFill();
  renderSummary();
}
function saveNote(member, di, val) {
  if (!localData[member])     localData[member] = {};
  if (!localData[member][di]) { localData[member][di] = {}; }
  localData[member][di].note = val;
  writeVal(`${dbPath(weekOffset)}/${member}/${di}/note`, val || null);
}

function setView(v) {
  view = v;
  document.getElementById('fillView').classList.toggle('hidden', v !== 'fill');
  document.getElementById('summaryView').classList.toggle('hidden', v !== 'summary');
  document.getElementById('tabFill').classList.toggle('active', v === 'fill');
  document.getElementById('tabSummary').classList.toggle('active', v === 'summary');
}
window.setView = setView;

function changeWeek(delta) {
  weekOffset += delta;
  localData = {};
  subscribe();
}
window.changeWeek = changeWeek;

function jumpToDate(dateVal) {
  if (!dateVal) return;
  const targetDate = new Date(dateVal);
  const targetMonday = new Date(targetDate);
  const day = targetDate.getDay() || 7;
  targetMonday.setDate(targetDate.getDate() - day + 1);
  targetMonday.setHours(0,0,0,0);
  
  const todayMonday = getMonday(0);
  const msDiff = targetMonday.getTime() - todayMonday.getTime();
  const weeksDiff = Math.round(msDiff / (1000 * 60 * 60 * 24 * 7));
  
  weekOffset = weeksDiff;
  localData = {};
  document.getElementById('datePicker').value = '';
  subscribe();
}
window.jumpToDate = jumpToDate;

function setMember(k) { 
  activeMember = k; 
  updateThemeStyles();
  renderPills(); 
  renderFill(); 
}
window.setMember = setMember;
window.toggleVal  = toggleVal;
window.saveNote   = saveNote;

function updateThemeStyles() {
  const currentMember = MEMBERS.find(m => m.key === activeMember);
  if (currentMember) {
    const root = document.documentElement;
    root.style.setProperty('--current-theme-bg', currentMember.themeBg);
    root.style.setProperty('--current-theme-border', currentMember.themeBorder);
    root.style.setProperty('--current-member-color', currentMember.color); 

    const banner = document.getElementById('editHintBanner');
    banner.style.backgroundColor = currentMember.bg;
    banner.style.color = currentMember.color;
    banner.innerHTML = `✍️ <span style="text-decoration: underline; margin: 0 2px;">${currentMember.name}</span>'s editing`;
  }
}

function renderPills() {
  document.getElementById('memberPills').innerHTML = MEMBERS.map(m => {
    const active = m.key === activeMember;
    const style  = active ? `border-color:${m.color}; background:${m.bg}; color:${m.color};` : '';
    return `<button class="member-pill ${active?'active':''}" style="${style}" onclick="setMember('${m.key}')">
      <span class="dot" style="background:${m.color}"></span>${m.name}
    </button>`;
  }).join('');
}

function renderFill() {
  const dates = weekDates(weekOffset);
  document.getElementById('fillBody').innerHTML = DAYS.map((day, di) => {
    const L = getVal(activeMember, di, 'L');
    const D = getVal(activeMember, di, 'D');
    const n = getNote(activeMember, di).replace(/"/g, '&quot;');
    const dateStr = `${dates[di].getMonth()+1}/${dates[di].getDate()}`;
    return `<tr>
      <td>
        <div class="day-name">${day}</div>
        <div class="day-date">${dateStr}</div>
      </td>
      <td><button class="toggle-btn ${L?'on':''}" onclick="toggleVal('${activeMember}',${di},'L')">${L?'✓':'—'}</button></td>
      <td><button class="toggle-btn ${D?'on':''}" onclick="toggleVal('${activeMember}',${di},'D')">${D?'✓':'—'}</button></td>
      <td><input class="note-input" placeholder="Note…" value="${n}" onchange="saveNote('${activeMember}',${di},this.value)"></td>
    </tr>`;
  }).join('');
}

// ✨ 改寫：渲染全新的時間軸 Summary 視覺畫面
function renderSummary() {
  const dates = weekDates(weekOffset);
  let html = '';

  DAYS.forEach((day, di) => {
    const dateStr = `${dates[di].getMonth()+1}/${dates[di].getDate()}`;
    
    // 撈取中午與晚上用餐名單
    const lunchAttendees = MEMBERS.filter(m => getVal(m.key, di, 'L'));
    const dinnerAttendees = MEMBERS.filter(m => getVal(m.key, di, 'D'));
    
    // 撈取當天所有人的備註整合
    const dayNotes = MEMBERS.map(m => {
      const n = getNote(m.key, di);
      return n ? `${m.name}: ${n}` : '';
    }).filter(Boolean).join(' | ');

    // 依據人數產生對應的配色 Class
    const getPillClass = (count) => {
      if (count === 0) return 'p0';
      if (count === 1) return 'p1';
      if (count === 2) return 'p2';
      return 'p3plus';
    };

    const lCountStr = lunchAttendees.length === 0 ? '—' : (lunchAttendees.length === 1 ? '1p' : `${lunchAttendees.length}ps`);
    const dCountStr = dinnerAttendees.length === 0 ? '—' : (dinnerAttendees.length === 1 ? '1p' : `${dinnerAttendees.length}ps`);

    // 格式化名字呈現（加上各自專屬的顏色小點點）
    const formatNames = (attendees) => {
      if (attendees.length === 0) return 'No one';
      return attendees.map(m => `<span class="member-tag"><span class="member-tag-dot" style="background:${m.color}"></span>${m.name}</span>`).join('');
    };

    html += `
      <div class="day-card">
        <div class="day-card-header">
          ${day} <span>${dateStr}</span>
        </div>
        
        <!-- Lunch 行 -->
        <div class="meal-row ${lunchAttendees.length === 0 ? 'empty' : ''}">
          <div class="meal-time">☀️ Lunch</div>
          <div><span class="count-pill ${getPillClass(lunchAttendees.length)}">${lCountStr}</span></div>
          <div class="meal-members">${formatNames(lunchAttendees)}</div>
        </div>
        
        <!-- Dinner 行 -->
        <div class="meal-row ${dinnerAttendees.length === 0 ? 'empty' : ''}">
          <div class="meal-time">🌙 Dinner</div>
          <div><span class="count-pill ${getPillClass(dinnerAttendees.length)}">${dCountStr}</span></div>
          <div class="meal-members">${formatNames(dinnerAttendees)}</div>
          ${dayNotes ? `<div class="meal-note" title="${dayNotes}">💬 ${dayNotes}</div>` : ''}
        </div>
      </div>
    `;
  });

  document.getElementById('timelineContainer').innerHTML = html;
}

function render() {
  document.getElementById('weekLabel').textContent = fmtLabel(weekOffset);
  updateThemeStyles(); 
  renderPills();
  renderFill();
  renderSummary();
}

render();
subscribe();
</script>
</body>
</html>
